[project]
name = "flights-mx-bot-api"
version = "0.1.0"
description = "MVP backend for an authorized multi-airline Telegram flight assistant."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "bot*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
