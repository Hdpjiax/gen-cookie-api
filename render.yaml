services:
  - type: web
    name: flights-mx-api
    env: python
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_SECRET_PEPPER
        generateValue: true

  - type: worker
    name: flights-mx-bot
    env: python
    buildCommand: pip install -e .
    startCommand: python -m bot.main
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
